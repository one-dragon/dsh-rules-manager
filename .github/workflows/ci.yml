# Two rules from the official testing policy drive this file: a test that does not
# call the model needs no API key and therefore belongs in CI rather than behind a
# key gate (docs/postmortem/0001), and the layers that do need a credential must
# skip themselves instead of failing (docs/testing.md). Every step below is keyless;
# the live-model lane is deliberately absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `dsh plugin add` in the smoke lane shells out to pnpm, which the runner
      # image does not ship.
      - run: npm i -g pnpm@10
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:snapshot
      - run: npm run test:integration
      # The smoke lane drives its own DSH process. The published CLI carries the
      # headless template (verified: it boots and composes this plugin), so no
      # desktop install is needed. Name the prerelease exactly: `@0.2` is a
      # semver range, ranges never match prereleases, so npm resolved nothing
      # and the step died with ETARGET on the fifth run (2026-11-27). Keep the
      # pin inside engines.dsh.
      - run: npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.5
      - run: npm run test:e2e
        env:
          DSH_CLI: ${{ runner.temp }}/dsh/node_modules/.bin/dsh
        timeout-minutes: 15
